name: Publish basketball career
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Explicitly publish after approval
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Check light career
        run: |
          node test-light.cjs
          node test-light-ui.cjs
          node test-light-broadcast.cjs
          node test-light-mini.cjs
      - name: Build and validate website
        run: |
          python3 tools/build_release.py
          python3 tools/check_release.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    if: ${{ inputs.publish }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
